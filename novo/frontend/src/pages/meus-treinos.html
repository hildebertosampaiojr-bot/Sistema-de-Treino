<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#090a0d" />
  <title>Meus treinos - AOLDEYA Fitness</title>
  <link rel="stylesheet" href="../styles/style.css" />
  <link rel="stylesheet" href="../styles/meus-treinos.css" />
</head>
<body class="app-page workouts-page" data-page="workouts">
  <section class="phone app-phone" aria-label="Meus treinos AOLDEYA Fitness">
    <div class="app-backdrop" aria-hidden="true"></div>
    <div class="status" aria-hidden="true"><span>9:41</span><div class="island"></div><div class="signals"><span class="bars"><i></i><i></i><i></i><i></i></span><span class="wifi"></span><span class="battery"><i></i></span></div></div>
    <main class="app-main workouts-main">
      <header class="workouts-topbar"><a class="back app-back" href="dashboard.html" aria-label="Voltar ao início"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></a><div><p class="eyebrow">Seu plano personalizado</p><h1>Meus treinos</h1></div><span class="avatar-initial">J</span></header>
      <section class="day-picker" aria-label="Selecione um dia">
        <button class="day-button active" type="button" data-day="seg"><span>Seg</span><small>1</small></button>
        <button class="day-button" type="button" data-day="ter"><span>Ter</span><small>2</small></button>
        <button class="day-button" type="button" data-day="qua"><span>Qua</span><small>3</small></button>
        <button class="day-button" type="button" data-day="qui"><span>Qui</span><small>4</small></button>
        <button class="day-button" type="button" data-day="sex"><span>Sex</span><small>5</small></button>
        <button class="day-button" type="button" data-day="sab"><span>Sáb</span><small>6</small></button>
        <button class="day-button" type="button" data-day="dom"><span>Dom</span><small>7</small></button>
      </section>
      <section class="workout-heading"><div><p id="selected-day-label">Segunda-feira</p><h2 id="selected-workout-title">Peito</h2></div><span class="exercise-count" id="exercise-count">6 exercícios</span></section>
      <section class="exercise-list" id="exercise-list" aria-live="polite"></section>
      <section class="rest-card" id="rest-card" hidden><span>+</span><h2>Dia de recuperação</h2><p>Descanse, hidrate-se e prepare-se para o próximo treino.</p></section>
      <dialog class="exercise-dialog" id="exercise-dialog" aria-labelledby="exercise-dialog-title">
        <button class="exercise-dialog-close" id="exercise-dialog-close" type="button" aria-label="Fechar descrição">×</button>
        <img class="exercise-dialog-image" id="exercise-dialog-image" src="../assets/exercise-placeholder.svg" alt="Demonstração do exercício" />
        <div class="exercise-dialog-content">
          <p class="eyebrow" id="exercise-dialog-category">Exercício</p>
          <h2 id="exercise-dialog-title"></h2>
          <p class="exercise-dialog-summary" id="exercise-dialog-summary"></p>
          <h3>Como executar</h3>
          <p id="exercise-dialog-description"></p>
          <small class="exercise-dialog-credit">Imagens: <a href="https://github.com/yuhonas/free-exercise-db" target="_blank" rel="noreferrer">Free Exercise DB</a> (Unlicense)</small>
        </div>
      </dialog>
      <footer class="workout-footer"><button class="button primary finish-workout" type="button">Finalizar treino<svg viewBox="0 0 24 24"><path d="M4 12h15m-7-7 7 7-7 7"/></svg></button></footer>
      <nav class="app-nav" aria-label="Navegação principal"><a class="nav-link" href="dashboard.html"><span>+</span>Início</a><a class="nav-link active" href="meus-treinos.html"><span>+</span>Meus treinos</a></nav>
    </main>
  </section>
  <script src="../data/workouts.js" defer></script>
  <script src="../scripts/script.js" defer></script>
  <script src="../scripts/progress.js" defer></script>
  <script src="../scripts/meus-treinos.js" defer></script>
</body>
</html>
