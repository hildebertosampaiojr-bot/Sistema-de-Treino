name: Publicar AOLDEYA Fitness novo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Preparar apenas a versao nova
        run: |
          mkdir -p _site
          cp -R novo/frontend/src/. _site/
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="pt-BR">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta http-equiv="refresh" content="0; url=pages/index.html">
            <title>AOLDEYA Fitness</title>
            <script>location.replace('pages/index.html' + location.search + location.hash);</script>
          </head>
          <body><a href="pages/index.html">Abrir AOLDEYA Fitness</a></body>
          </html>
          HTML
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
